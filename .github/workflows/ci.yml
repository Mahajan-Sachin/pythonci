name: Python CI
on:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
      - run: pip install -r requirements.txt
      - run: pytest

      - name: docker login and push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }} 
      - run: docker build -t sachinmahajan23/pythonci:latest .
      - run: docker push sachinmahajan23/pythonci:latest
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build step can be added here after tests pass."
  
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deployment step can be added here after build step."
  
