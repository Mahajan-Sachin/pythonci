name: Python CI

on:
  workflow_dispatch: # Allows manual triggering of the workflow from the GitHub Actions tab.

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - run: pip install -r requirements.txt

      - run: pytest